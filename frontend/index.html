    <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ótica Express - Vitrine</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/store.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="mode-store">
    <!-- TOP BAR -->
    <header class="store-header">
        <div class="header-container">
            <div class="header-logo" onclick="window.location.href='index.html'">
                <div class="logo-box">
                    <span class="material-icons logo-icon">visibility</span>
                    <div class="logo-text">
                        <strong>Ótica</strong><span>Express</span>
                    </div>
                </div>
            </div>
            
            <div class="header-search">
                <div class="search-box">
                    <span class="material-icons search-icon">search</span>
                    <input type="text" id="inputPesquisar" placeholder="Pesquisar..." oninput="filtrarCatalogo()">
                </div>
            </div>

            <div class="header-actions">
                <button class="action-btn" title="Medição Pupilar" id="btnMedicao" onclick="window.location.href='medicao.html'" style="position:relative;">
                    <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="color: var(--azul-escuro);">
                        <!-- Óculos -->
                        <circle cx="10" cy="13" r="5.5" stroke="currentColor" stroke-width="2" fill="none"/>
                        <circle cx="22" cy="13" r="5.5" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M15.5 13c0-1.5 0.5-2 0.5-2s0.5 0.5 0.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M4.5 13c-1 0-1.5-0.5-2-1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <path d="M27.5 13c1 0 1.5-0.5 2-1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                        <!-- Régua -->
                        <rect x="5" y="22" width="22" height="5" rx="1.5" stroke="currentColor" stroke-width="1.5" fill="none"/>
                        <line x1="9" y1="22" x2="9" y2="24" stroke="currentColor" stroke-width="1.2"/>
                        <line x1="13" y1="22" x2="13" y2="25" stroke="currentColor" stroke-width="1.2"/>
                        <line x1="17" y1="22" x2="17" y2="24" stroke="currentColor" stroke-width="1.2"/>
                        <line x1="21" y1="22" x2="21" y2="25" stroke="currentColor" stroke-width="1.2"/>
                        <line x1="25" y1="22" x2="25" y2="24" stroke="currentColor" stroke-width="1.2"/>
                    </svg>
                </button>
                <button class="action-btn" title="Meus Pedidos" id="btnHeaderPedidos">
                    <span class="material-icons">assignment</span>
                </button>
                <button class="action-btn" title="Carrinho" onclick="window.location.href='Cliente/carrinho.html'">
                    <span class="material-icons">shopping_cart</span>
                    <span class="cart-badge" id="carrinhoQuantidade">0</span>
                </button>
                <button class="action-btn user-btn" title="Minha Conta" id="btnHeaderUser">
                    <span class="material-icons">account_circle</span>
                    <span id="userNameHeader">Entrar</span>
                </button>
            </div>
        </div>
    </header>

    <div class="layout-container">
        <main class="main-content">
            <h1 class="view-title animate-fade">Promoções</h1>
            <div class="product-grid" id="catalogoGrid">
                <!-- Inserido via JS -->
            </div>
        </main>
    </div>

    <script src="auth.js"></script>
    <script src="index.js"></script>
</body>
</html>
